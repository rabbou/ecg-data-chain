[project]
name = "ecg-data-chain"
version = "0.1.0"
description = "From the raw corpus formats to a queryable ECG database whose every tracing points back to the file it came from."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scipy>=1.13",
    "wfdb>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgchain"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pandas-stubs"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: needs the ECG corpora on disk"]
